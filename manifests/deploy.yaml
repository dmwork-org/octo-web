apiVersion: apps/v1
kind: Deployment
metadata:
  name: octo-web-{{BRANCH}}
  labels:
    app: octo-web
    branch: "{{BRANCH}}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: octo-web
      branch: "{{BRANCH}}"
  template:
    metadata:
      labels:
        app: octo-web
        branch: "{{BRANCH}}"
    spec:
      containers:
        - name: octo-web
          image: "{{REPO_URL}}:{{IMAGE_TAG}}"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: API_URL
              value: "{{API_URL}}"
          readinessProbe:
            httpGet:
              path: /api/v1/common/appconfig
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/common/appconfig
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
      imagePullSecrets:
        - name: tcr-image-xtiao
---
apiVersion: v1
kind: Service
metadata:
  name: octo-web-{{BRANCH}}
  labels:
    app: octo-web
    branch: "{{BRANCH}}"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: octo-web
    branch: "{{BRANCH}}"
